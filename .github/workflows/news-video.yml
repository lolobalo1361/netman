name: Netman Persian News Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: netman-news-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg and Persian fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news-video-generator/requirements.txt
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r news-video-generator/requirements.txt
      - name: Render video and send to Telegram when configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python news-video-generator/render.py
      - name: Upload MP4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netman-persian-news-video
          path: news-video-generator/output/
          if-no-files-found: warn
          retention-days: 3
